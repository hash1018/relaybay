[package]
name = "relaybay"
version = "0.1.0"
edition = "2024"
description = "A media relay that accepts a live stream over one protocol and serves it over any of the others"
repository = "https://github.com/hash1018/relaybay"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["rtmp", "rtsp", "webrtc", "streaming", "server"]
categories = ["multimedia::video", "network-programming"]

[dependencies]
bytes = "1"
thiserror = "2"
# Only the layers that touch a socket or fan out to readers use this. The
# protocol under them — codecs, chunks, AMF0, the session — is runtime-free
# and stays that way, so an application can embed the server without the
# runtime reaching its own code.
tokio = { version = "1", features = [
    "sync",
    "rt",
    "rt-multi-thread",
    "net",
    "io-util",
    "macros",
] }
# A server that cannot say why it dropped a connection is one nobody can
# operate. Without a subscriber installed these compile to a level check and
# nothing else, so an embedder that does not want the output does not pay for
# it.
tracing = "0.1"
# The binary's own log output. Nothing in the library uses it: an embedder
# installs whichever subscriber its application already has.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "ansi",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

[lib]
name = "relaybay"
path = "src/lib.rs"

[[bin]]
name = "relaybay"
path = "src/main.rs"
