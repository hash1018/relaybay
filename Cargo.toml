[package]
name = "relaybay"
version = "0.1.0"
edition = "2024"
description = "A media relay that accepts a live stream over one protocol and serves it over any of the others"
repository = "https://github.com/hash1018/relaybay"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["rtmp", "rtsp", "webrtc", "streaming", "server"]
categories = ["multimedia::video", "network-programming"]

[dependencies]
bytes = "1"
thiserror = "2"
# Only the layers that touch a socket or fan out to readers use this. The
# protocol under them — codecs, chunks, AMF0, the session — is runtime-free
# and stays that way, so an application can embed the server without the
# runtime reaching its own code.
tokio = { version = "1", features = ["sync", "rt", "macros"] }

[lib]
name = "relaybay"
path = "src/lib.rs"

[[bin]]
name = "relaybay"
path = "src/main.rs"
