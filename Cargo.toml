[package]
name = "relaybay"
version = "0.1.0"
edition = "2024"
description = "A media relay that accepts a live stream over one protocol and serves it over any of the others"
repository = "https://github.com/hash1018/relaybay"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["rtmp", "rtsp", "webrtc", "streaming", "server"]
categories = ["multimedia::video", "network-programming"]

[dependencies]
bytes = "1"
thiserror = "2"

[lib]
name = "relaybay"
path = "src/lib.rs"

[[bin]]
name = "relaybay"
path = "src/main.rs"
